services:
  sync:
    build:
      context: .
      dockerfile: Dockerfile.sync
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    volumes:
      - ./:/site

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    volumes:
      - ./:/usr/share/nginx/html:ro
